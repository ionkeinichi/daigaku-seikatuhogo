  // --- 日付を指定して休講にする ---
  const cancelPeriodSelect = document.getElementById('cancelPeriodSelect');
  cancelPeriodSelect.innerHTML = PERIODS.map(p => `<option value="${p}">${p}限（${PERIOD_TIMES[p]}）</option>`).join('');

  function updateCancelModalInfo() {
    const dateVal = document.getElementById('cancelDateInput').value;
    const toggleBtn = document.getElementById('cancelToggleBtn');
    const info = document.getElementById('cancelInfoText');
    if (!dateVal) {
      info.textContent = '日付を選んでください';
      toggleBtn.disabled = true;
      return;
    }
    const day = dayOfWeekFromDateStr(dateVal);
    const period = Number(cancelPeriodSelect.value);
    if (!DAYS.includes(day)) {
      info.textContent = '日曜日は授業の登録がありません';
      toggleBtn.disabled = true;
      return;
    }
    const sk = scheduleKey(day, period, parseDateInput(dateVal));
    const entry = sk ? normalize(schedules[sk]) : null;
    if (!entry) {
      info.textContent = 'この日・時限に登録されている授業はありません（学期期間外の可能性があります）';
      toggleBtn.disabled = true;
      return;
    }
    const key = `${dateVal}_${period}`;
    const cancelled = !!cancellations[key];
    info.textContent = `${entry.subject}（${cancelled ? '現在：休講' : '現在：通常授業'}）`;
    toggleBtn.textContent = cancelled ? '休講を解除する' : '休講にする';
    toggleBtn.disabled = false;
  }

  document.getElementById('openCancelByDate').addEventListener('click', () => {
    document.getElementById('cancelDateInput').value = formatDateKey(new Date());
    updateCancelModalInfo();
    document.getElementById('cancelOverlay').style.display = 'flex';
  });
  document.getElementById('cancelOverlayClose').addEventListener('click', () => {
    document.getElementById('cancelOverlay').style.display = 'none';
  });
  document.getElementById('cancelOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'cancelOverlay') document.getElementById('cancelOverlay').style.display = 'none';
  });
  document.getElementById('cancelDateInput').addEventListener('change', updateCancelModalInfo);
  cancelPeriodSelect.addEventListener('change', updateCancelModalInfo);

  document.getElementById('cancelToggleBtn').addEventListener('click', () => {
    const dateVal = document.getElementById('cancelDateInput').value;
    const period = Number(cancelPeriodSelect.value);
    if (!dateVal) return;
    const key = `${dateVal}_${period}`;
    if (cancellations[key]) {
      delete cancellations[key];
    } else {
      cancellations[key] = true;
    }
    saveCancellations();
    updateCancelModalInfo();
    refreshView();
  });

  document.getElementById('jumpDate').addEventListener('change', (e) => {
    if (!e.target.value) return;
    const [y, m, d] = e.target.value.split('-').map(Number);
    weekStart = getMonday(new Date(y, m - 1, d));
    render();
  });

  document.getElementById('prevWeek').addEventListener('click', () => {
    weekStart.setDate(weekStart.getDate() - 7);
    weekStart = new Date(weekStart);
    render();
  });
  document.getElementById('nextWeek').addEventListener('click', () => {
    weekStart.setDate(weekStart.getDate() + 7);
    weekStart = new Date(weekStart);
    render();
  });

  // --- 週表示／日表示の切り替え ---
  function setViewMode(mode) {
    viewMode = mode;
    document.getElementById('toggleWeekView').classList.toggle('active', mode === 'week');
    document.getElementById('toggleDayView').classList.toggle('active', mode === 'day');
    document.getElementById('weekNav').style.display = mode === 'week' ? 'flex' : 'none';
    document.getElementById('dayNav').style.display = mode === 'day' ? 'flex' : 'none';
    document.getElementById('weekTableWrap').style.display = mode === 'week' ? 'inline-block' : 'none';
    document.getElementById('dayView').style.display = mode === 'day' ? 'block' : 'none';
    // 日別表示では、下に回り込む「スケジュール」「課題」の欄は出さない
    document.querySelector('.side-col').style.display = mode === 'week' ? 'flex' : 'none';
    document.getElementById('addScheduleDayBtn').style.display = mode === 'day' ? 'inline-block' : 'none';
    if (mode === 'week') {
      render();
    } else {
      renderDayView();
      scrollDayToFocus();
    }
  }
  document.getElementById('toggleWeekView').addEventListener('click', () => setViewMode('week'));
  document.getElementById('toggleDayView').addEventListener('click', () => setViewMode('day'));

  document.getElementById('prevDay').addEventListener('click', () => {
    selectedDayOfWeek -= 1;
    if (selectedDayOfWeek < 1) {
      selectedDayOfWeek = 7;
      weekStart.setDate(weekStart.getDate() - 7);
      weekStart = new Date(weekStart);
    }
    renderDayView();
    scrollDayToFocus();
  });
  document.getElementById('nextDay').addEventListener('click', () => {
    selectedDayOfWeek += 1;
    if (selectedDayOfWeek > 7) {
      selectedDayOfWeek = 1;
      weekStart.setDate(weekStart.getDate() + 7);
      weekStart = new Date(weekStart);
    }
    renderDayView();
    scrollDayToFocus();
  });
  document.getElementById('dayJumpDate').addEventListener('change', (e) => {
    if (!e.target.value) return;
    const date = parseDateInput(e.target.value);
    const dow = dayOfWeekFromDateStr(e.target.value);
    weekStart = getMonday(date);
    selectedDayOfWeek = dow;
    renderDayView();
    scrollDayToFocus();
  });

  document.getElementById('schedulePanel').addEventListener('click', () => {
    const now = new Date();
    now.setMinutes(0, 0, 0);
    now.setHours(now.getHours() + 1); // 開始は次の区切りの時刻、終了はその1時間後を初期値にする
    setScheduleFields('', now);
    setScheduleFields('End', new Date(now.getTime() + 60 * 60 * 1000));
    document.getElementById('scheduleError').style.display = 'none';
    renderAllScheduleList();
    document.getElementById('scheduleAllOverlay').style.display = 'flex';
  });
  document.getElementById('scheduleAllOverlayClose').addEventListener('click', () => {
    document.getElementById('scheduleAllOverlay').style.display = 'none';
  });
  document.getElementById('scheduleAllOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'scheduleAllOverlay') document.getElementById('scheduleAllOverlay').style.display = 'none';
  });

  // --- 課題管理 ---
  const ASSIGN_KEY = 'campus-lifeline-week1-assignments';
  let assignTab = 'upcoming'; // 'upcoming'（これから）| 'past'（過去）
  let assignments = [];
  try {
    assignments = JSON.parse(localStorage.getItem(ASSIGN_KEY) || '[]');
    if (!Array.isArray(assignments)) assignments = [];
  } catch (e) { assignments = []; }

  function saveAssignments() {
    try { localStorage.setItem(ASSIGN_KEY, JSON.stringify(assignments)); } catch (e) {}
  }

  // 課題ログ：登録・提出済み・未提出に戻した・削除の履歴を、日時つきで残す
  const ASSIGN_LOG_KEY = 'campus-lifeline-week1-assign-log';
  let assignLog = [];
  try {
    assignLog = JSON.parse(localStorage.getItem(ASSIGN_LOG_KEY) || '[]');
    if (!Array.isArray(assignLog)) assignLog = [];
  } catch (e) { assignLog = []; }

  function saveAssignLog() {
    try { localStorage.setItem(ASSIGN_LOG_KEY, JSON.stringify(assignLog)); } catch (e) {}
  }

  // 課題が後で削除されてもログが読めるよう、課題名・授業・期限をその時点のまま記録する
  function logAssign(action, a) {
    assignLog.push({ at: new Date().toISOString(), action, title: a.title, subject: a.subject || '', due: a.date });
    if (assignLog.length > 500) assignLog = assignLog.slice(-500);
    saveAssignLog();
  }

  function toggleAssignment(id) {
    const a = assignments.find(x => x.id === id);
    if (!a) return;
    a.submitted = !a.submitted;
    logAssign(a.submitted ? 'submit' : 'unsubmit', a);
    saveAssignments();
    renderAssignList();
    refreshView();
  }

  function deleteAssignment(id) {
    const a = assignments.find(x => x.id === id);
    if (!a) return;
    logAssign('delete', a);
    assignments = assignments.filter(x => x.id !== id);
    saveAssignments();
  }

  // 未提出の課題が、その日に期限を迎えるか（カレンダーの日付に赤い点を付けるため）
  function hasDueOn(date) {
    const key = formatDateKey(date);
    return assignments.some(a => !a.submitted && a.date === key);
  }

  function assignDaysLabel(n) {
    if (n < 0) return `${-n}日超過`;
    if (n === 0) return '今日まで';
    return `あと${n}日`;
  }

  function renderAssignList() {
    const box = document.getElementById('assignList');
    // 期限を過ぎた未提出の課題があれば、「過去」タブに赤い印を出す
    document.getElementById('assignPastAlert').style.display =
      assignments.some(a => !a.submitted && daysUntil(a.date) < 0) ? 'inline-block' : 'none';

    const isPast = assignTab === 'past';
    const inTab = assignments.filter(a => isPast ? daysUntil(a.date) < 0 : daysUntil(a.date) >= 0);
    if (inTab.length === 0) {
      box.innerHTML = `<p class="schedule-empty">${isPast ? '過去の課題はありません' : 'これからの課題はありません'}</p>`;
      return;
    }
    // 未提出を上、提出済みを下にまとめる。これからは期限の近い順、過去は新しい順
    const byDate = (a, b) => isPast ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date);
    const todo = inTab.filter(a => !a.submitted).sort(byDate);
    const done = inTab.filter(a => a.submitted).sort(byDate);
    box.innerHTML = [...todo, ...done].map(a => {
      const n = daysUntil(a.date);
      const d = parseDateInput(a.date);
      const md = `${d.getMonth() + 1}/${d.getDate()}`;
      let cls = '';
      if (a.submitted) cls = ' done';
      else if (n < 0) cls = ' overdue';
      else if (n < 3) cls = ' urgent';
      const label = a.submitted ? '提出済み' : assignDaysLabel(n);
      const subj = a.subject ? `<span class="assign-subject">${escapeHtml(a.subject)}</span>` : '';
      return `<div class="assign-item${cls}">
        <button class="schedule-delete" data-id="${a.id}" aria-label="削除">×</button>
        <span class="assign-date">${md}（${label}）</span>
        <span class="assign-name">${escapeHtml(a.title)}</span> ${subj}
        <div><button class="assign-toggle" data-id="${a.id}">${a.submitted ? '未提出に戻す' : '提出済みにする'}</button></div>
      </div>`;
    }).join('');

    box.querySelectorAll('.assign-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        toggleAssignment(btn.dataset.id);
      });
    });
    box.querySelectorAll('.schedule-delete').forEach(btn => {
      btn.addEventListener('click', () => {
        deleteAssignment(btn.dataset.id);
        renderAssignList();
        refreshView();
      });
    });
  }

  // 表示中の週の学期に登録されている授業名の一覧（課題の紐づけ用）
  function currentSubjects() {
    const set = new Set();
    DAYS.forEach(d => PERIODS.forEach(p => {
      const k = scheduleKey(d, p);
      if (!k) return;
      const e = normalize(schedules[k]);
      if (e && e.subject) set.add(e.subject);
    }));
    return Array.from(set);
  }

  // 月・日の入力から、現在履修中の学期の範囲に収まる年を判定する
  function resolveAssignmentYear(month, day) {
    const today = new Date();
    const info = findActiveTermInfo(today) || findActiveTermInfo(weekStart);
    if (!info) return today.getFullYear();
    const years = Array.from(new Set([info.window.start.getFullYear(), info.window.end.getFullYear()]));
    for (const y of years) {
      const cand = new Date(y, month - 1, day);
      if (cand >= info.window.start && cand <= info.window.end) return y;
    }
    return years[0];
  }

  const assignMonthSelect = document.getElementById('assignMonthInput');
  const assignDaySelect = document.getElementById('assignDayInput');
  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement('option');
    opt.value = String(m);
    opt.textContent = `${m}月`;
    assignMonthSelect.appendChild(opt);
  }
  for (let d = 1; d <= 31; d++) {
    const opt = document.createElement('option');
    opt.value = String(d);
    opt.textContent = `${d}日`;
    assignDaySelect.appendChild(opt);
  }

  function closeAssignModal() {
    document.getElementById('assignOverlay').style.display = 'none';
  }

  document.getElementById('openAssignBtn').addEventListener('click', () => {
    const sel = document.getElementById('assignSubjectSelect');
    sel.innerHTML = '<option value="">指定なし</option>' +
      currentSubjects().map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
    document.getElementById('assignTitleInput').value = '';
    const now = new Date();
    assignMonthSelect.value = String(now.getMonth() + 1);
    assignDaySelect.value = String(now.getDate());
    document.getElementById('assignOverlay').style.display = 'flex';
    setTimeout(() => document.getElementById('assignTitleInput').focus(), 0);
  });
  document.getElementById('assignCancelBtn').addEventListener('click', closeAssignModal);
  document.getElementById('assignOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'assignOverlay') closeAssignModal();
  });
  document.getElementById('assignAddBtn').addEventListener('click', () => {
    const title = document.getElementById('assignTitleInput').value.trim();
    if (!title) return;
    const month = Number(assignMonthSelect.value);
    const day = Number(assignDaySelect.value);
    const year = resolveAssignmentYear(month, day);
    assignments.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      title,
      subject: document.getElementById('assignSubjectSelect').value,
      date: formatDateKey(new Date(year, month - 1, day)),
      submitted: false,
    });
    logAssign('add', assignments[assignments.length - 1]);
    saveAssignments();
    renderAssignList();
    refreshView();
    closeAssignModal();
  });

  // --- 授業ごとのメモ（タブで複数ページを持てる） ---
  const MEMO_KEY = 'campus-lifeline-week1-memos';
  let memos = {};
  try {
    memos = JSON.parse(localStorage.getItem(MEMO_KEY) || '{}');
    if (!memos || typeof memos !== 'object' || Array.isArray(memos)) memos = {};
  } catch (e) { memos = {}; }
  function saveMemos() {
    try { localStorage.setItem(MEMO_KEY, JSON.stringify(memos)); } catch (e) {}
  }

  let viewSubject = '';   // 授業の画面で開いている授業名
  let memoSubject = '';   // メモを開いている授業名
  let deleteArmed = false;
  let deleteTimer = null;

  function newMemoId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function memoBook() {
    const b = memos[memoSubject];
    if (!b || !Array.isArray(b.tabs) || b.tabs.length === 0) {
      const id = newMemoId();
      memos[memoSubject] = { tabs: [{ id, title: 'メモ1', body: '' }], active: id };
    }
    return memos[memoSubject];
  }

  function activeMemoTab(book) {
    return book.tabs.find(t => t.id === book.active) || book.tabs[0];
  }

  function resetDeleteArm() {
    deleteArmed = false;
    clearTimeout(deleteTimer);
    document.getElementById('memoDeleteBtn').textContent = 'このタブを削除';
  }

  function renderMemoTabs() {
    const book = memoBook();
    const tab = activeMemoTab(book);
    const box = document.getElementById('memoTabs');
    box.innerHTML = book.tabs.map(t =>
      `<button class="memo-tab${t.id === tab.id ? ' active' : ''}" data-id="${t.id}">${escapeHtml(t.title || '無題')}</button>`
    ).join('') + '<button class="memo-tab memo-tab-add" id="memoAddTab">＋</button>';

    box.querySelectorAll('.memo-tab[data-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        book.active = btn.dataset.id;
        saveMemos();
        resetDeleteArm();
        renderMemo();
      });
    });
    document.getElementById('memoAddTab').addEventListener('click', () => {
      const id = newMemoId();
      book.tabs.push({ id, title: `メモ${book.tabs.length + 1}`, body: '' });
      book.active = id;
      saveMemos();
      resetDeleteArm();
      renderMemo();
      document.getElementById('memoTitleInput').select();
    });
  }

  function renderMemo() {
    const book = memoBook();
    const tab = activeMemoTab(book);
    book.active = tab.id;
    document.getElementById('memoSubject').textContent = memoSubject;
    document.getElementById('memoTitleInput').value = tab.title;
    document.getElementById('memoBody').value = tab.body;
    renderMemoTabs();
  }

  document.getElementById('openMemoBtn').addEventListener('click', () => {
    if (!viewSubject) return;
    memoSubject = viewSubject;
    resetDeleteArm();
    renderMemo();
    document.getElementById('memoOverlay').style.display = 'flex';
  });
  function closeMemo() {
    resetDeleteArm();
    document.getElementById('memoOverlay').style.display = 'none';
  }
  document.getElementById('memoCloseBtn').addEventListener('click', closeMemo);
  document.getElementById('memoOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'memoOverlay') closeMemo();
  });

  // 入力するたびに自動保存する
  document.getElementById('memoTitleInput').addEventListener('input', (e) => {
    const tab = activeMemoTab(memoBook());
    tab.title = e.target.value;
    saveMemos();
    renderMemoTabs();
  });
  document.getElementById('memoBody').addEventListener('input', (e) => {
    const tab = activeMemoTab(memoBook());
    tab.body = e.target.value;
    saveMemos();
  });

  // 削除は誤操作を防ぐため、2回押したときだけ実行する（1つしかない場合は中身を空にする）
  document.getElementById('memoDeleteBtn').addEventListener('click', () => {
    if (!deleteArmed) {
      deleteArmed = true;
      document.getElementById('memoDeleteBtn').textContent = 'もう一度押すと削除';
      deleteTimer = setTimeout(resetDeleteArm, 3000);
      return;
    }
    resetDeleteArm();
    const book = memoBook();
    const tab = activeMemoTab(book);
    if (book.tabs.length > 1) {
      book.tabs = book.tabs.filter(t => t.id !== tab.id);
      book.active = book.tabs[0].id;
    } else {
      tab.title = 'メモ1';
      tab.body = '';
    }
    saveMemos();
    renderMemo();
  });

  // --- 課題ログの表示 ---
  function renderAssignLog() {
    // 上の集計：今の課題の提出状況
    const todo = assignments.filter(a => !a.submitted);
    const overdue = todo.filter(a => daysUntil(a.date) < 0).length;
    const inTime = todo.length - overdue;
    const done = assignments.length - todo.length;
    document.getElementById('assignLogSummary').innerHTML = `
      <div class="log-chip"><b>${inTime}</b>期限内の未提出</div>
      <div class="log-chip${overdue > 0 ? ' alert' : ''}"><b>${overdue}</b>期限切れの未提出</div>
      <div class="log-chip"><b>${done}</b>提出済み</div>`;

    const labels = { add: '登録', submit: '提出済みにした', unsubmit: '未提出に戻した', delete: '削除' };
    const box = document.getElementById('assignLogList');
    if (assignLog.length === 0) {
      box.innerHTML = '<p class="schedule-empty">まだ記録がありません（これから登録・提出した分が残ります）</p>';
      return;
    }
    box.innerHTML = assignLog.slice().reverse().map(e => {
      const d = new Date(e.at);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      const when = `${d.getMonth() + 1}/${d.getDate()} ${hh}:${mm}`;
      const due = parseDateInput(e.due);
      let note = due ? `期限 ${due.getMonth() + 1}/${due.getDate()}` : '';
      if (e.action === 'submit' && due) {
        // 提出した日が、期限の何日前（または何日遅れ）だったか
        const diff = Math.round((due - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
        note += diff > 0 ? `（期限の${diff}日前に提出）` : (diff === 0 ? '（期限当日に提出）' : `（${-diff}日遅れで提出）`);
      }
      const subj = e.subject ? ` <span class="assign-subject">${escapeHtml(e.subject)}</span>` : '';
      return `<div class="log-item ${e.action}">
        <span class="log-time">${when}</span>
        <span class="log-action">${labels[e.action] || e.action}</span>　${escapeHtml(e.title)}${subj}
        <span class="log-note">${note}</span>
      </div>`;
    }).join('');
  }

  document.getElementById('openAssignLogBtn').addEventListener('click', () => {
    renderAssignLog();
    document.getElementById('assignLogOverlay').style.display = 'flex';
  });
  document.getElementById('assignLogCloseBtn').addEventListener('click', () => {
    document.getElementById('assignLogOverlay').style.display = 'none';
  });
  document.getElementById('assignLogOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'assignLogOverlay') document.getElementById('assignLogOverlay').style.display = 'none';
  });

  function setAssignTab(tab) {
    assignTab = tab;
    document.getElementById('assignTabUpcoming').classList.toggle('active', tab === 'upcoming');
    document.getElementById('assignTabPast').classList.toggle('active', tab === 'past');
    renderAssignList();
  }
  document.getElementById('assignTabUpcoming').addEventListener('click', () => setAssignTab('upcoming'));
  document.getElementById('assignTabPast').addEventListener('click', () => setAssignTab('past'));

  // スケジュール：授業の時限とは関係なく、開始と終了の日付・時刻で登録する
  const pad2 = (n) => String(n).padStart(2, '0');

  // prefix は '' （開始）または 'End' （終了）
  function setScheduleFields(prefix, d) {
    document.getElementById(`schedule${prefix}MonthInput`).value = String(d.getMonth() + 1);
    document.getElementById(`schedule${prefix}DayInput`).value = String(d.getDate());
    document.getElementById(`schedule${prefix}TimeInput`).value = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }

  function readScheduleDT(prefix) {
    const month = Number(document.getElementById(`schedule${prefix}MonthInput`).value);
    const day = Number(document.getElementById(`schedule${prefix}DayInput`).value);
    const time = document.getElementById(`schedule${prefix}TimeInput`).value || '00:00';
    if (!month || !day) return null;
    const year = resolveScheduleYear(month, day);
    const [hh, mm] = time.split(':').map(Number);
    return { dateStr: formatDateKey(new Date(year, month - 1, day)), time, dt: new Date(year, month - 1, day, hh, mm) };
  }

  // 開始を変えたとき、終了が開始より前になっていたら、開始の1時間後に合わせる
  function syncScheduleEnd() {
    const st = readScheduleDT('');
    const en = readScheduleDT('End');
    document.getElementById('scheduleError').style.display = 'none';
    if (!st) return;
    if (!en || en.dt < st.dt) setScheduleFields('End', new Date(st.dt.getTime() + 60 * 60 * 1000));
  }
  ['scheduleMonthInput', 'scheduleDayInput', 'scheduleTimeInput'].forEach(id =>
    document.getElementById(id).addEventListener('change', syncScheduleEnd));
  ['scheduleEndMonthInput', 'scheduleEndDayInput', 'scheduleEndTimeInput'].forEach(id =>
    document.getElementById(id).addEventListener('change', () => {
      document.getElementById('scheduleError').style.display = 'none';
    }));

  document.getElementById('addScheduleBtn').addEventListener('click', () => {
    const text = document.getElementById('scheduleTextInput').value.trim();
    const st = readScheduleDT('');
    const en = readScheduleDT('End');
    if (!text || !st) return;
    if (en && en.dt < st.dt) {
      document.getElementById('scheduleError').style.display = 'block';
      return;
    }
    document.getElementById('scheduleError').style.display = 'none';

    scheduleItems.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      date: st.dateStr,
      time: st.time,
      endDate: en ? en.dateStr : '',
      endTime: en ? en.time : '',
      text,
    });
    saveScheduleItems();
    document.getElementById('scheduleTextInput').value = '';
    renderScheduleList();
    renderAllScheduleList();
    refreshView();
  });

  // 「この週だけオンデマンド」の切り替え
  document.getElementById('ondemandWeekBtn').addEventListener('click', () => {
    if (!current) return;
    const key = ondemandWeekKey(current.day, current.period);
    if (ondemandOverrides[key]) {
      delete ondemandOverrides[key];
    } else {
      ondemandOverrides[key] = true;
    }
    saveOndemandOverrides();
    const sk = scheduleKey(current.day, current.period);
    const entry = sk ? normalize(schedules[sk]) : null;
    if (entry) openViewPanel(current.day, current.period, entry);
    refreshView();
  });

  // 日別表示から：表示中の日を初期値にして、スケジュール追加の画面を開く
  document.getElementById('addScheduleDayBtn').addEventListener('click', () => {
    const d = dateForDay(selectedDayOfWeek);
    const now = new Date();
    let start;
    if (formatDateKey(d) === formatDateKey(now)) {
      start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours() + 1, 0); // 今日は次の区切りの時刻
    } else {
      start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 9, 0);
    }
    setScheduleFields('', start);
    setScheduleFields('End', new Date(start.getTime() + 60 * 60 * 1000));
    document.getElementById('scheduleError').style.display = 'none';
    document.getElementById('scheduleTextInput').value = '';
    document.getElementById('scheduleAllOverlay').style.display = 'flex';
  });

  // 「今日」ボタン：今日を含む週（日別表示なら今日）に戻る
  document.getElementById('todayBtn').addEventListener('click', () => {
    const now = new Date();
    weekStart = getMonday(now);
    selectedDayOfWeek = now.getDay() === 0 ? 7 : now.getDay();
    if (viewMode === 'day') {
      renderDayView();
      scrollDayToFocus();
    } else {
      render();
    }
  });

  render();
  renderScheduleList();
  renderAssignList();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.93.0"></script>
<script>
(function () {
  // ===== Supabase（ログインとデータ保存）=====
  // ここに入れるのは、公開してよい「Publishable key」だけです（secret / service_role は絶対に入れない）
  var SB_URL = 'https://tomocnvwfewgbyjtzrdw.supabase.co';
  var SB_KEY = 'sb_publishable_3Sx8PPXHmxSvSmQ8au93DA_ZIFVcaFo';

  var PREFIX = 'campus-lifeline-week1-';          // このアプリが使うlocalStorageのキーの先頭
  var META_USER = 'campus-lifeline-meta-user';    // このブラウザのデータが誰のものか
  var UNLINKED_BACKUP = 'campus-lifeline-unlinked-backup';

  function $(id) { return document.getElementById(id); }
  var sb = window.supabase.createClient(SB_URL, SB_KEY);

  var currentUser = null;
  var pending = {};          // まだサーバーへ送っていないキー
  var flushTimer = null;
  var statusTimer = null;
  var lastSeen = {};         // キーごとに、最後に確認したサーバー側の更新時刻
  var appStarted = false;

  // ---- 画面の下に出す保存状況 ----
  function setStatus(text, kind) {
    var el = $('syncStatus');
    el.textContent = text;
    el.className = 'sync-status show' + (kind ? ' ' + kind : '');
    clearTimeout(statusTimer);
    if (kind === 'ok') statusTimer = setTimeout(function () { el.classList.remove('show'); }, 1500);
  }

  // ---- localStorageへの保存を横取りして、ログイン中はSupabaseにも送る ----
  var origSet = Storage.prototype.setItem;
  Storage.prototype.setItem = function (k, v) {
    origSet.call(this, k, v);
    if (this === window.localStorage && currentUser && typeof k === 'string' && k.indexOf(PREFIX) === 0) {
      pending[k] = true;
      scheduleFlush();
    }
  };

  function scheduleFlush(delay) {
    clearTimeout(flushTimer);
    setStatus('保存中…');
    flushTimer = setTimeout(flush, delay == null ? 700 : delay);
  }

  async function flush() {
    if (!currentUser) return;
    var keys = Object.keys(pending);
    if (keys.length === 0) return;
    pending = {};
    var now = new Date().toISOString();
    var rows = keys.map(function (k) {
      var raw = localStorage.getItem(k);
      var value;
      try { value = JSON.parse(raw); } catch (e) { value = { __raw: raw }; }
      if (value === null || value === undefined) value = {};
      return { user_id: currentUser.id, key: k, value: value, updated_at: now };
    });
    var res = await sb.from('app_data').upsert(rows, { onConflict: 'user_id,key' });
    if (res.error) {
      keys.forEach(function (k) { pending[k] = true; });
      setStatus('保存できませんでした。通信を確認してください', 'err');
      clearTimeout(flushTimer);
      flushTimer = setTimeout(flush, 5000);
      return;
    }
    keys.forEach(function (k) { lastSeen[k] = now; });
    setStatus('保存しました', 'ok');
  }

  // ---- 他の端末で更新されていたら、読み込み直す ----
  async function checkRemote() {
    var res = await sb.from('app_data').select('key,updated_at');
    if (res.error || !res.data) return;
    var changed = res.data.some(function (r) {
      var seen = lastSeen[r.key];
      return !seen || new Date(r.updated_at).getTime() > new Date(seen).getTime();
    });
    if (changed) location.reload();
  }

  document.addEventListener('visibilitychange', async function () {
    if (!currentUser) return;
    if (document.visibilityState === 'hidden') {
      clearTimeout(flushTimer);
      flush();
    } else {
      await flush();
      checkRemote();
    }
  });
  window.addEventListener('pagehide', function () {
    if (!currentUser) return;
    clearTimeout(flushTimer);
    flush();
  });

  // ---- localStorageの整理 ----
  function localKeys() {
    var keys = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf(PREFIX) === 0) keys.push(k);
    }
    return keys;
  }
  function clearLocal() {
    localKeys().forEach(function (k) { localStorage.removeItem(k); });
  }
  function backupAndClearLocal() {
    var dump = {};
    localKeys().forEach(function (k) { dump[k] = localStorage.getItem(k); });
    origSet.call(localStorage, UNLINKED_BACKUP, JSON.stringify(dump));
    clearLocal();
  }

  // ---- ログイン画面 ----
  function showAuth(message) {
    document.body.classList.remove('app-ready');
    $('authScreen').style.display = 'flex';
    authMsg(message || '');
  }
  function authMsg(text, kind) {
    var el = $('authMsg');
    el.textContent = text || '';
    el.className = 'auth-msg' + (kind ? ' ' + kind : '');
  }
  function authBusy(b) {
    ['authLoginBtn', 'authSignupBtn', 'authGuestBtn'].forEach(function (id) { $(id).disabled = b; });
  }
  function jaError(err) {
    var m = (err && err.message) || '';
    if (/Invalid login credentials/i.test(m)) return 'メールアドレスまたはパスワードが違います';
    if (/Email not confirmed/i.test(m)) return 'メールの確認がまだ完了していません。届いたメールのリンクを開いてください';
    if (/already registered/i.test(m)) return 'このメールアドレスはすでに登録されています。ログインしてください';
    if (/at least 6/i.test(m)) return 'パスワードは6文字以上にしてください';
    if (/rate limit/i.test(m)) return '短い時間にメールを送りすぎました。しばらくしてからやり直してください';
    if (/valid email|invalid format/i.test(m)) return 'メールアドレスの形式を確認してください';
    return m || 'うまくいきませんでした';
  }

  async function doSignIn() {
    var email = $('authEmail').value.trim();
    var password = $('authPassword').value;
    if (!email || !password) { authMsg('メールアドレスとパスワードを入力してください'); return; }
    authMsg('');
    authBusy(true);
    var res = await sb.auth.signInWithPassword({ email: email, password: password });
    authBusy(false);
    if (res.error) { authMsg(jaError(res.error)); return; }
    await startWithUser(res.data.user);
  }

  async function doSignUp() {
    var email = $('authEmail').value.trim();
    var password = $('authPassword').value;
    if (!email || !password) { authMsg('メールアドレスとパスワードを入力してください'); return; }
    if (password.length < 6) { authMsg('パスワードは6文字以上にしてください'); return; }
    authMsg('');
    authBusy(true);
    var res = await sb.auth.signUp({ email: email, password: password, options: { emailRedirectTo: location.origin } });
    authBusy(false);
    if (res.error) { authMsg(jaError(res.error)); return; }
    if (res.data.session) {
      await startWithUser(res.data.user);
    } else {
      authMsg('確認メールを送りました。メールのリンクを開いてから、ログインしてください。', 'ok');
    }
  }

  // ---- ログイン後：サーバーのデータをこのブラウザに読み込んで、アプリを起動する ----
  async function startWithUser(user) {
    setStatus('読み込み中…');
    var res = await sb.from('app_data').select('key,value,updated_at');
    if (res.error) {
      $('syncStatus').classList.remove('show');
      showAuth('データを読み込めませんでした：' + res.error.message + '（SupabaseでSQLを実行済みか確認してください）');
      return;
    }
    var rows = res.data || [];
    var serverHas = rows.length > 0;
    var metaUser = localStorage.getItem(META_USER);
    var existing = localKeys();
    var uploadLocal = false;

    if (existing.length > 0) {
      if (metaUser && metaUser !== user.id) {
        clearLocal(); // 別のアカウントのデータが残っていたら、このブラウザからは消す
      } else if (!metaUser && !serverHas) {
        uploadLocal = confirm('このブラウザにあるデータを、アカウントに取り込みますか？\n\nOK：取り込む\nキャンセル：取り込まず、空の状態で始める');
        if (!uploadLocal) backupAndClearLocal();
      } else if (!metaUser && serverHas) {
        backupAndClearLocal(); // アカウントのデータを優先（ブラウザ側は控えを残す）
      }
    }

    // サーバーのデータを、アプリが読むlocalStorageに書き出す
    rows.forEach(function (r) {
      var v = r.value;
      var text = (v && typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length === 1 && v.__raw !== undefined)
        ? v.__raw : JSON.stringify(v);
      origSet.call(localStorage, r.key, text);
      lastSeen[r.key] = r.updated_at;
    });
    origSet.call(localStorage, META_USER, user.id);

    currentUser = user;

    // まだサーバーにないキー（取り込み分・送りそびれた分）を送る
    var serverKeys = {};
    rows.forEach(function (r) { serverKeys[r.key] = true; });
    localKeys().forEach(function (k) { if (!serverKeys[k]) pending[k] = true; });
    if (Object.keys(pending).length > 0) await flush();
    else $('syncStatus').classList.remove('show');

    $('authScreen').style.display = 'none';
    $('userEmail').textContent = user.email || '';
    $('userEmail').style.display = 'inline';
    $('logoutBtn').style.display = 'inline-block';
    launchApp();
  }

  function startGuest() {
    $('authScreen').style.display = 'none';
    $('goLoginBtn').style.display = 'inline-block';
    launchApp();
  }

  // 本体のスクリプトを、ログインの準備ができてから実行する
  function launchApp() {
    if (appStarted) return;
    appStarted = true;
    document.body.classList.add('app-ready');
    var s = document.createElement('script');
    s.textContent = $('appCode').textContent;
    document.body.appendChild(s);
  }

  $('authLoginBtn').addEventListener('click', doSignIn);
  $('authSignupBtn').addEventListener('click', doSignUp);
  $('authGuestBtn').addEventListener('click', startGuest);
  $('authPassword').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSignIn(); });
  $('goLoginBtn').addEventListener('click', function () { location.reload(); });
  $('logoutBtn').addEventListener('click', async function () {
    clearTimeout(flushTimer);
    await flush();
    await sb.auth.signOut();
    clearLocal();
    localStorage.removeItem(META_USER);
    location.reload();
  });

  (async function boot() {
    var res = await sb.auth.getSession();
    if (res.data && res.data.session) {
      await startWithUser(res.data.session.user);
    } else {
      showAuth();
    }
  })();
})();
</script>
